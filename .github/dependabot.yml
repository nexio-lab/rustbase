version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [dependencies, rust]
    groups:
      patch-updates:
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: [dependencies, ci]

  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
    labels: [dependencies, ui]
    groups:
      patch-updates:
        update-types: [patch]

  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: weekly
    labels: [dependencies, docs]
    groups:
      patch-updates:
        update-types: [patch]
