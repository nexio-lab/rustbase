# Shared local-dev services.
#
# Brought up with:  docker compose -f infra/docker-compose.yml up -d
# Brought down with: docker compose -f infra/docker-compose.yml down
#
# Why this lives here rather than in a separate repo: MailHog (and any
# follow-up dev services — MinIO, redis-for-tests, etc.) need to be
# reachable from *any* app you're hacking on, not only RustBase.
# Other apps reach this service two ways:
#
#   1. localhost ports — `localhost:1025` SMTP, `http://localhost:8025`
#      web UI. Works regardless of what container runtime the other
#      app uses (or no container at all).
#
#   2. The shared external network `dev-shared`. Other compose files
#      that declare it as `external: true` can address the SMTP relay
#      as `mailhog:1025` from inside their containers.

name: rustbase-dev-infra

services:
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP relay (apps point [mail.smtp] here)
      - "8025:8025"   # Web UI — open http://localhost:8025
    networks:
      - dev-shared
    # MailHog stores messages in memory by default; restart wipes the
    # inbox, which is what you want for a dev capture.

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API (apps point [storage.s3].endpoint here)
      - "9001:9001"   # Web console — open http://localhost:9001
    networks:
      - dev-shared
    volumes:
      - minio-data:/data

  # One-shot job that creates the default bucket the moment MinIO is up.
  # Restarts as `exited`, which compose displays but doesn't try to keep
  # alive. Re-running compose up is idempotent (mc mb returns OK if the
  # bucket already exists).
  minio-bootstrap:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    container_name: minio-bootstrap
    depends_on:
      - minio
    networks:
      - dev-shared
    entrypoint: >
      /bin/sh -c "
        until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done &&
        /usr/bin/mc mb -p local/rustbase-dev || true &&
        echo 'minio bootstrap: bucket rustbase-dev ready'
      "

volumes:
  minio-data:

networks:
  # External so other apps' compose files can attach with:
  #   networks:
  #     dev-shared:
  #       external: true
  # Create it once with: docker network create dev-shared
  # (compose creates it on first `up` if missing, since `external: true`
  # is not set here — promote to external once you have a second app.)
  dev-shared:
    name: dev-shared
    driver: bridge
